name: Deploy Infrastructure

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'lib/shared-services/**'
      - 'test/shared-services-stack.test.ts'
      - '.github/**'
      - '**/*.md'
      - 'scripts/**'
  push:
    branches: [develop, main]
    paths-ignore:
      - 'lib/shared-services/**'
      - 'test/shared-services-stack.test.ts'
      - '.github/**'
      - '**/*.md'
      - 'scripts/**'
  # Manual re-run of a deploy against the current tip of develop/main — e.g. when a prior
  # push-triggered run failed on an unrelated, since-fixed check and paths-ignore means the
  # fix commit itself never re-triggered a deploy (see D-109 WS_MANAGEMENT_ENDPOINT incident,
  # 2026-07-15: HeediqApiStack silently ran 5 days behind develop after exactly this happened).
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, staging, prod]
        default: dev

# AWS_REGION and deploy role ARNs are resolved from GitHub organization-level
# Actions variables (D-070, D-071) — not hardcoded per repo.
env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Typecheck + Test + Synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Synth (validate without deploying)
        run: pnpm cdk synth -c env=dev --quiet

  deploy-dev:
    name: Deploy → dev
    needs: [validate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to dev
        # `-c analytics=true` enables the D-154 server-side analytics choke-point in dev (wires
        # AMPLITUDE_API_KEY onto the 3 emitting Lambdas from the shared /heediq/analytics/amplitude-api-key
        # SSM param — the same key heediq-web uses). Dev-only for now — staging/prod stay opt-out
        # (no flag → clean no-op) until deliberately enabled and their param is confirmed provisioned.
        run: pnpm cdk deploy --all -c env=dev -c analytics=true --require-approval never

  deploy-staging:
    name: Deploy → staging
    needs: [validate]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (staging)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to staging
        run: pnpm cdk deploy --all -c env=staging --require-approval never

  approve-prod:
    name: Approve → prod
    needs: [deploy-staging]
    if: |
      !cancelled() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-staging.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approved
        run: echo "Production deployment approved"

  deploy-prod:
    name: Deploy → prod
    needs: [approve-prod]
    if: |
      !cancelled() && needs.approve-prod.result == 'success'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to prod
        run: pnpm cdk deploy --all -c env=prod --require-approval never
